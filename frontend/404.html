<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | Hostelio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-accent-50:  #FBF0EB;
            --color-accent-100: #F5D9CC;
            --color-accent-200: #EDB89F;
            --color-accent-400: #D97040;
            --color-accent-600: #C95B2A;
            --color-accent-800: #8F3D18;
            --color-neutral-0:   #FFFFFF;
            --color-neutral-50:  #FAFAF8;
            --color-neutral-100: #F2EFE9;
            --color-neutral-200: #E2DED8;
            --color-neutral-300: #C8C4BC;
            --color-neutral-400: #A09C94;
            --color-neutral-500: #7D7970;
            --color-neutral-600: #6B6860;
            --color-neutral-800: #2E2C28;
            --color-neutral-900: #1A1A18;
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body:    'Inter', system-ui, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-neutral-100);
            color: var(--color-neutral-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 3.5rem;
        }

        .logo-mark {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--color-accent-600);
            color: #fff;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-name {
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-neutral-900);
        }

        .container {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .error-number {
            font-family: var(--font-heading);
            font-size: 7rem;
            font-weight: 700;
            line-height: 1;
            color: var(--color-neutral-200);
            letter-spacing: -4px;
            margin-bottom: 0.25rem;
            user-select: none;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: var(--color-accent-400);
            margin: 1.5rem auto;
            border-radius: 2px;
        }

        .title {
            font-family: var(--font-heading);
            font-size: 1.563rem;
            font-weight: 700;
            color: var(--color-neutral-900);
            line-height: 1.2;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--color-neutral-500);
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            font-family: var(--font-body);
            font-size: 0.875rem;
            font-weight: 600;
            color: #fff;
            background: var(--color-accent-600);
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            cursor: pointer;
            text-decoration: none;
            transition: background 150ms ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary:hover {
            background: var(--color-accent-800);
        }

        .btn-ghost {
            font-family: var(--font-body);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-neutral-600);
            background: transparent;
            border: 1px solid var(--color-neutral-300);
            border-radius: 8px;
            padding: 10px 24px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 150ms ease, color 150ms ease;
            display: inline-flex;
            align-items: center;
        }

        .btn-ghost:hover {
            border-color: var(--color-neutral-500);
            color: var(--color-neutral-900);
        }

        @media (max-width: 480px) {
            .error-number { font-size: 5rem; }
            .title { font-size: 1.25rem; }
            .actions { flex-direction: column; align-items: center; }
            .btn-primary, .btn-ghost { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="brand">
        <div class="logo-mark">H</div>
        <span class="brand-name">Hostelio</span>
    </div>

    <div class="container">
        <p class="error-number">404</p>

        <div class="divider"></div>

        <h1 class="title">Página no encontrada</h1>
        <p class="subtitle">
            La ruta que buscas no existe o fue movida.<br>
            Comprueba la URL o vuelve al inicio.
        </p>

        <div class="actions">
            <a href="/" class="btn-primary">
                Ir al inicio
            </a>
            <a href="#" onclick="window.history.back(); return false;" class="btn-ghost">
                Volver atrás
            </a>
        </div>
    </div>

</body>
</html>
