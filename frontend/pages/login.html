<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostelio - Login</title>
    <link rel="stylesheet" href="../styles/main.css">
    <script type="module" src="../js/main.js"></script>
</head>
<body class="auth-layout" data-page="login">
    <main class="auth-layout">
        <section class="auth-panel">
            <div class="auth-panel-header">
                <span>Bienvenido de nuevo a Hostelio</span>
                <h2>Accede a tu cuenta</h2>
            </div>
            <form class="auth-form">
                <input type="email" name="email" placeholder="Correo electr&oacute;nico" required>
                <input type="password" name="password" placeholder="••••••••" required>
                <button type="submit">Login</button>
            </form>
            <p class="divider">No tienes una cuenta? <a href="../pages/signup.html">Registrate</a></p>
        </section>
        <section class="auth-branding">
            <div class="branding-content">
                <span class="auth-badge">Hostelio</span>
                <h3>Gestiona tu negocio de forma elegante.</h3>

                <p>Controla gastos, proveedores y estadísticas desde una única plataforma diseñada para negocios.</p>

                <div class="branding-stats">
                    <article>
                        <strong>24/7</strong>
                        <span>Control de tu negocio</span>
                    </article>
                </div>
            </div>
        </section>        
    </main>
</body>
</html>
